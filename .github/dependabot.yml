version: 2
updates:
  # Third-party actions are pinned to commit SHAs; Dependabot bumps the SHA and
  # keeps the `# vX.Y.Z` comment in sync.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Mirrors `minimumReleaseAge` in pnpm-workspace.yaml: a freshly published
    # version is not proposed until it has survived a week in the wild.
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      dev-tooling:
        dependency-type: development
        patterns: ['*']
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 5
