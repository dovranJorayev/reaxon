name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deny everything at the top; each job requests exactly what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build, publint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version comes from package.json#packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # No dependency cache on purpose: a poisoned cache entry was the pivot in
      # the May 2026 TanStack compromise. A cold install of this workspace takes
      # seconds; the risk is not worth it.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Lint published package shape
        run: pnpm publint

  peer-matrix:
    name: Peers (${{ matrix.package }}, ${{ matrix.edge }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each package is tested at both edges of every peerDependencies
          # range it declares. `oldest` pins the exact lower bounds; `newest`
          # re-resolves to the highest version inside the range (subject to the
          # workspace's release cooldown). The peer-deps.test.ts guard in each
          # package asserts the installed versions are inside the declared range,
          # so a widened range that was never run here fails fast.
          - package: '@reaxon/tanstack-query-mobx'
            edge: oldest
            command: add -D @tanstack/query-core@4.0.0 mobx@6.0.0
          - package: '@reaxon/tanstack-query-mobx'
            edge: newest
            command: update @tanstack/query-core@4 mobx@6
          - package: '@reaxon/hook-form-effector'
            edge: oldest
            command: add -D effector@23.0.0 react-hook-form@7.55.0
          - package: '@reaxon/hook-form-effector'
            edge: newest
            command: update effector@23 react-hook-form@7
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version comes from package.json#packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install peer versions under test
        env:
          PACKAGE: ${{ matrix.package }}
          COMMAND: ${{ matrix.command }}
        run: |
          # shellcheck disable=SC2086
          pnpm --filter "$PACKAGE" $COMMAND
          pnpm --filter "$PACKAGE" list --depth 0

      - name: Typecheck and test against those peers
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          pnpm --filter "$PACKAGE" typecheck
          pnpm --filter "$PACKAGE" test

  workflow-lint:
    name: Lint GitHub Actions workflows (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
          min-severity: low

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review new dependencies for known vulnerabilities and licence problems
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, Unlicense, CC0-1.0, BlueOak-1.0.0
